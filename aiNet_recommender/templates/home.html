<!doctype html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Adaptive Movie System</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>

    <body>
        <h1>Adaptive Movie AI</h1>

        <p>Welcome, User! Rate a few movies below and click Update to get recommendations.</p>

        <form action="{{ url_for('rate') }}" method="post">
            <table>
                {% for movie in movie_objects %}
                <tr>
                    <td>{{ movie.name }}</td>
                    <td>
                        <select name="rating_{{ movie.id }}">
                            <option value="0" {% if ratings.get(movie.id, 0) == 0 %}selected{% endif %}>Not rated</option>
                            <option value="1" {% if ratings.get(movie.id) == 1 %}selected{% endif %}>1</option>
                            <option value="2" {% if ratings.get(movie.id) == 2 %}selected{% endif %}>2</option>
                            <option value="3" {% if ratings.get(movie.id) == 3 %}selected{% endif %}>3</option>
                            <option value="4" {% if ratings.get(movie.id) == 4 %}selected{% endif %}>4</option>
                            <option value="5" {% if ratings.get(movie.id) == 5 %}selected{% endif %}>5</option>
                        </select>
                    </td>
                </tr>
                {% endfor %}
            </table>

            <button type="submit">Update</button>
        </form>

        {% if recommendations %}
        <h2>Recommended for you</h2>

        <div class="recommendations">
            {% for movie, affinity in recommendations %}
            <div class="movie-card">
                <p>{{ movie.name }}</p>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </body>
</html>
